name: Check app updates

on:
  schedule:
    # Every 2 hours, at :17 past the hour. GitHub runs scheduled workflows on a
    # best-effort basis and regularly starts them hours late (the top of the
    # hour is the most congested), so the check must never depend on starting
    # at an exact clock time — whenever a run starts, it checks every app.
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never run two checkers at once (overlapping pushes would conflict).
concurrency:
  group: check-updates
  cancel-in-progress: false

jobs:
  check:
    # Skip on forks: they should configure their own schedule deliberately.
    if: github.repository == 'DawsonCodes/AppWatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check stores for updates
        id: check
        run: npm run check:updates

      - name: Validate generated data
        run: npm run validate:data

      - name: Commit updated data
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "chore(data): update tracked app metadata"
          # main may have moved during the run (e.g. a merged pull request);
          # the checker only touches public/data, so a rebase is safe.
          git pull --rebase origin main
          git push origin main

      # status.json is rewritten on every run (so the site's "last checked"
      # time stays accurate) but only committed alongside real data changes.
      # Hand the freshly generated data to the deploy job either way.
      - name: Upload checked data for deployment
        uses: actions/upload-artifact@v7
        with:
          name: appwatch-data
          path: public/data
          retention-days: 1

  # Pushes made with GITHUB_TOKEN do not fire the deploy workflow's `push`
  # trigger (GitHub's recursion protection), so deploy explicitly after every
  # successful check. Deploying takes about a minute and keeps the published
  # "last checked" time honest even when no app changed.
  deploy:
    needs: check
    uses: ./.github/workflows/deploy.yml
    with:
      data-artifact: appwatch-data
    permissions:
      contents: read
      pages: write
      id-token: write
